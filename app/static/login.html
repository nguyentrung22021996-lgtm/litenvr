<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Đăng nhập · LiteNVR Pro</title>
  <style>
    :root {
      --bg-base: #080b10;
      --bg-card: #111621;
      --bg-input: #171e2c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
      --accent: #e53935;
      --accent-hover: #f44336;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(229, 57, 53, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      width: min(94vw, 400px);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 32px 26px;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardEnter 0.45s var(--ease-out) both;
    }

    .lock-ico {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: linear-gradient(135deg, rgba(229, 57, 53, 0.18), rgba(229, 57, 53, 0.05));
      border: 1px solid rgba(229, 57, 53, 0.3);
      border-radius: 16px;
      animation: pulseGlow 3s infinite;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
      margin-bottom: 4px;
    }

    .brand span {
      color: var(--accent);
    }

    .sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin: 14px 0 6px;
      letter-spacing: 0.2px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), background 0.2s;
    }

    input:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    input:focus,
    input:focus-visible {
      outline: none;
      background: #1c2436;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
    }

    #otpBox {
      display: none;
      animation: slideDown 0.25s var(--ease-out) both;
    }

    #otp {
      letter-spacing: 4px;
      font-weight: 700;
      text-align: center;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 15.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(229, 57, 53, 0.3);
      transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), filter 0.18s;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(229, 57, 53, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #err {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      color: #f87171;
      min-height: 20px;
      text-align: center;
    }

    .hint {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      input, button { font-size: 16px; }
      .login-card { padding: 26px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="lock-ico" aria-hidden="true">🔒</div>
    <div class="brand">Lite<span>NVR</span> Pro</div>
    <div class="sub">Đăng nhập để xem camera &amp; bản ghi</div>

    <label for="username">Tên đăng nhập</label>
    <input id="username" name="username" autocomplete="username" required autofocus>

    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div id="otpBox">
      <label for="otp">Mã xác thực 2 lớp (6 số)</label>
      <input id="otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
    </div>

    <button type="submit" id="btnLogin">Đăng nhập</button>
    <div id="err" role="alert" aria-live="polite"></div>
    <div class="hint">Tài khoản do quản trị viên tạo. Quên mật khẩu? Liên hệ quản trị viên LiteNVR.</div>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const errEl = document.getElementById("err");
    const btn = document.getElementById("btnLogin");
    const otpBox = document.getElementById("otpBox");
    const otpInput = document.getElementById("otp");

    async function isAuthed() {
      try {
        const r = await fetch("/api/me", { credentials: "same-origin", cache: "no-store" });
        return r.ok;
      } catch (e) { return false; }
    }

    (async () => {
      if (await isAuthed()) { location.replace("/"); return; }
      // Xoá cookie phiên cũ/hỏng để tránh vòng lặp chuyển hướng im lặng
      try {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin",
          headers: { "X-NVR-CSRF": "1" } });
      } catch (e) {}
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Đang đăng nhập…";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-NVR-CSRF": "1" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            otp: otpInput.value.trim()
          })
        });
        let d = {};
        try { d = await r.json(); } catch (e) {}
        if (r.ok) {
          if (await isAuthed()) { location.replace("/"); return; }
          errEl.textContent = "Đã xác thực nhưng trình duyệt không lưu được phiên đăng nhập "
            + "(cookie bị chặn hoặc trang cũ đang được cache). Hãy mở LiteNVR ở tab riêng, "
            + "cho phép cookie cho trang này rồi tải lại (Ctrl+F5).";
          return;
        }
        if (d.otp_required) {
          otpBox.style.display = "block";
          otpInput.focus();
        }
        errEl.textContent = (typeof d.detail === "string" && d.detail) || ("Lỗi đăng nhập (" + r.status + ")");
      } catch (ex) {
        errEl.textContent = "Không kết nối được máy chủ — kiểm tra mạng rồi thử lại.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Đăng nhập";
      }
    });
  </script>
</body>
</html>
