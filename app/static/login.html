<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Đăng nhập · LiteNVR Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #121212; color: #eee; font-family: system-ui, -apple-system, sans-serif;
      padding: 16px; background-image: radial-gradient(ellipse at top, #1c1c1c 0%, #121212 60%);
    }
    .login-card {
      width: min(94vw, 380px); background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
      padding: 26px 22px; box-shadow: 0 18px 40px rgba(0,0,0,.5);
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: .3px; text-align: center; margin-bottom: 2px; }
    .brand span { color: #e53935; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #bbb; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 11px 12px; background: #2a2a2a; color: #fff; border: 1px solid #444;
      border-radius: 8px; font-size: 16px; font-family: inherit;
    }
    input:focus-visible { outline: 2px solid #64b5f6; outline-offset: 1px; border-color: #64b5f6; }
    button {
      width: 100%; margin-top: 18px; padding: 12px; background: #e53935; color: #fff; border: 0;
      border-radius: 8px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #f0504c; }
    button:focus-visible { outline: 2px solid #64b5f6; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: wait; }
    #err { margin-top: 12px; font-size: 13px; color: #ef5350; min-height: 18px; text-align: center; }
    #otpBox { display: none; }
    .hint { margin-top: 16px; font-size: 12px; color: #777; text-align: center; line-height: 1.5; }
    .lock-ico { text-align: center; font-size: 30px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="lock-ico" aria-hidden="true">🔒</div>
    <div class="brand">Lite<span>NVR</span> Pro</div>
    <div class="sub">Đăng nhập để xem camera &amp; bản ghi</div>

    <label for="username">Tên đăng nhập</label>
    <input id="username" name="username" autocomplete="username" required autofocus>

    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div id="otpBox">
      <label for="otp">Mã xác thực 2 lớp (6 số)</label>
      <input id="otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
    </div>

    <button type="submit" id="btnLogin">Đăng nhập</button>
    <div id="err" role="alert" aria-live="polite"></div>
    <div class="hint">Tài khoản do quản trị viên tạo. Quên mật khẩu? Liên hệ quản trị viên LiteNVR.</div>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const errEl = document.getElementById("err");
    const btn = document.getElementById("btnLogin");
    const otpBox = document.getElementById("otpBox");
    const otpInput = document.getElementById("otp");

    fetch("/api/me", { credentials: "same-origin" }).then(r => {
      if (r.ok) location.href = "/";
    }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-NVR-CSRF": "1" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            otp: otpInput.value.trim()
          })
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { location.href = "/"; return; }
        if (d.otp_required) {
          otpBox.style.display = "block";
          otpInput.focus();
        }
        errEl.textContent = d.detail || ("Lỗi đăng nhập (" + r.status + ")");
      } catch (ex) {
        errEl.textContent = "Không kết nối được máy chủ — kiểm tra mạng rồi thử lại.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
