<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteNVR Pro - ZimaOS Camera NVR</title>
  <script src="/static/hls.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #eee; }
    header { display: flex; gap: 8px; padding: 12px 16px; background: #1e1e1e; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #333; }
    select, input, button { padding: 8px 12px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button.active { background: #e53935; border-color: #e53935; }
    button.primary { background: #1976d2; border-color: #1976d2; }
    button.warn { background: #ef6c00; border-color: #ef6c00; }
    .disk-badge { margin-left: auto; font-size: 12px; color: #ddd; background: #252525; padding: 6px 10px; border-radius: 6px; cursor: pointer; border: 1px solid #444; }
    .player-box { width: 100%; max-width: 1000px; margin: 12px auto; background: #000; aspect-ratio: 16/9; position: relative; border-radius: 8px; overflow: hidden; }
    video { width: 100%; height: 100%; }
    .timeline-container { max-width: 1000px; margin: 15px auto; padding: 0 12px; }
    .timeline-bar { height: 46px; background: #252525; position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid #444; touch-action: none; }
    .seg-mark { position: absolute; top: 0; bottom: 0; width: 0.25%; background: #2e7d32; }
    .evt-mark { position: absolute; top: 0; bottom: 0; width: 3px; background: #ff1744; z-index: 2; }
    .cursor-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffeb3b; z-index: 3; pointer-events: none; }
    .events-list { max-width: 1000px; margin: 20px auto; padding: 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .event-card { background: #1e1e1e; border-radius: 8px; padding: 8px; cursor: pointer; border: 1px solid #333; }
    .event-card img { width: 100%; height: 115px; object-fit: cover; border-radius: 4px; background: #000; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); align-items: center; justify-content: center; z-index: 10; padding: 12px; }
    .modal-box { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; border: 1px solid #444; }
    .form-row { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cam-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #2a2a2a; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #388e3c; margin-left: 6px; }
    .badge.motion { background: #f57c00; }
    .badge.off { background: #616161; }
  </style>
</head>
<body>
  <header>
    <select id="camSelect"></select>
    <input type="date" id="dateInput">
    <button id="btnLive" class="active" onclick="playLive()">Trực tiếp (Live)</button>
    <button class="warn" onclick="testMotion()">⚡ Test Motion</button>
    <button class="primary" onclick="openCamModal()">+ Quản lý Camera</button>
    <button onclick="openStorageModal()">⚙️ Cài đặt Lưu trữ</button>
    <span id="statusText" style="font-size:13px;color:#ccc;">Đang khởi tạo...</span>
    <div class="disk-badge" id="diskBadge" onclick="openStorageModal()">HDD: --</div>
  </header>

  <div class="player-box">
    <video id="videoPlayer" controls autoplay muted playsinline></video>
  </div>

  <div class="timeline-container">
    <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa; margin-bottom:4px;">
      <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span>
    </div>
    <div class="timeline-bar" id="timelineBar" onclick="seekTimeline(event)">
      <div class="cursor-line" id="cursorLine" style="left:0%"></div>
    </div>
  </div>

  <div class="events-list" id="eventsList"></div>

  <!-- Modal Quản lý Camera -->
  <div class="modal" id="camModal">
    <div class="modal-box">
      <h3 style="margin-top:0">Quản lý & Thêm Camera Đa Hãng</h3>
      <div id="camListBox" style="margin-bottom:14px;"></div>

      <div class="grid-2">
        <div class="form-row">
          <label>Chọn hãng Camera (Tự tạo link RTSP):</label>
          <select id="inpBrand" onchange="applyBrandPreset()">
            <option value="custom">Tự nhập đường dẫn RTSP</option>
            <option value="imou">Imou / Dahua / KBVision</option>
            <option value="ezviz">Ezviz / Hikvision / HiLook</option>
            <option value="tapo">TP-Link Tapo / Vigigi</option>
            <option value="yoosee">Yoosee (onvif1 / onvif2)</option>
            <option value="xiaomi">Xiaomi / Yi / Thingino</option>
          </select>
        </div>
        <div class="form-row">
          <label>Chế độ ghi hình ổ cứng:</label>
          <select id="inpRecordMode">
            <option value="continuous">Lưu liên tục 24/7</option>
            <option value="motion">Chỉ lưu khi có chuyển động (HASS)</option>
            <option value="off">Chỉ xem trực tiếp (Không lưu)</option>
          </select>
        </div>
      </div>

      <div class="grid-2" id="quickGenBox" style="display:none; background:#252525; padding:10px; border-radius:6px; margin-bottom:10px;">
        <div class="form-row">
          <label>IP Camera:</label>
          <input id="genIp" placeholder="192.168.1.105" oninput="applyBrandPreset()">
        </div>
        <div class="form-row">
          <label>Tài khoản (User):</label>
          <input id="genUser" value="admin" oninput="applyBrandPreset()">
        </div>
        <div class="form-row" style="grid-column: span 2;">
          <label>Mật khẩu / Mã Verification Code (in dưới đáy cam):</label>
          <input id="genPass" placeholder="Nhập mật khẩu cam..." oninput="applyBrandPreset()">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-row">
          <label>Mã Camera (viết liền, dùng cho HASS):</label>
          <input id="inpCamId" placeholder="VD: cam_cong">
        </div>
        <div class="form-row">
          <label>Tên hiển thị:</label>
          <input id="inpCamName" placeholder="VD: Camera Cổng Chính">
        </div>
      </div>

      <div class="form-row">
        <label>RTSP Luồng chính (Main Stream - Ghi hình nét):</label>
        <input id="inpRtsp" placeholder="rtsp://admin:pass@192.168.1.100:554/...">
      </div>
      <div class="form-row">
        <label>RTSP Luồng phụ (Sub Stream - Tùy chọn giúp xem Live nhẹ hơn):</label>
        <input id="inpSubRtsp" placeholder="Để trống nếu dùng chung luồng chính">
      </div>

      <div class="grid-2">
        <div class="form-row">
          <label>Giao thức truyền tải:</label>
          <select id="inpTransport">
            <option value="tcp">TCP (Ổn định, khuyên dùng)</option>
            <option value="udp">UDP (Dành cho cam Yoosee đời cũ)</option>
          </select>
        </div>
        <div class="form-row">
          <label>Xử lý Âm thanh (Audio):</label>
          <select id="inpAudio">
            <option value="aac">Bật âm thanh (Chuẩn AAC)</option>
            <option value="none">Tắt âm thanh (Tránh lỗi cam kén tiếng)</option>
            <option value="copy">Giữ nguyên gốc (Copy)</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
        <button onclick="closeCamModal()">Đóng</button>
        <button class="primary" onclick="saveCamera()">Lưu Camera</button>
      </div>
    </div>
  </div>

  <!-- Modal Cài đặt Lưu trữ & Dọn dẹp ổ cứng -->
  <div class="modal" id="storageModal">
    <div class="modal-box">
      <h3 style="margin-top:0">Cài đặt Lưu trữ & Tự động Xóa</h3>
      <div class="form-row">
        <label>Số ngày lưu tối đa (Quá số ngày này tự động xóa):</label>
        <input type="number" id="inpRetDays" min="1" max="365" step="1">
      </div>
      <div class="form-row">
        <label>Giới hạn dung lượng tối đa cho NVR (GB - Nhập 0 nếu không giới hạn):</label>
        <input type="number" id="inpMaxGb" min="0" step="10">
      </div>
      <div class="form-row">
        <label>Ngưỡng đầy ổ cứng tối đa (% - Vượt ngưỡng này sẽ tự xóa video cũ nhất):</label>
        <input type="number" id="inpMaxPct" min="10" max="98" step="1">
      </div>
      <div class="form-row">
        <label>Thời gian ghi hình mỗi lần có chuyển động (Giây - Áp dụng chế độ Motion):</label>
        <input type="number" id="inpPostMotion" min="15" max="600" step="5">
      </div>
      <div style="display:flex; gap:8px; justify-content:space-between; margin-top:14px;">
        <button class="warn" onclick="cleanNow()">🧹 Dọn ổ cứng ngay</button>
        <div style="display:flex; gap:8px;">
          <button onclick="closeStorageModal()">Đóng</button>
          <button class="primary" onclick="saveStorage()">Lưu cấu hình</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let cameras = {}, sysInfo = {}, currentCam = "", segments = [], hls = null;
    const video = document.getElementById("videoPlayer");
    const dateInput = document.getElementById("dateInput");
    dateInput.value = new Date().toISOString().split("T")[0];

    async function loadSystem() {
      const res = await fetch("/api/system");
      sysInfo = await res.json();
      document.getElementById("diskBadge").textContent =
        `NVR: ${sysInfo.nvr_used_gb}GB | HDD: ${sysInfo.disk_used_gb}/${sysInfo.disk_total_gb}GB (${sysInfo.disk_percent}%)`;
    }

    async function init() {
      await loadSystem();
      const res = await fetch("/api/cameras");
      cameras = await res.json();
      const sel = document.getElementById("camSelect");
      sel.innerHTML = "";
      for (const [id, info] of Object.entries(cameras)) {
        const opt = document.createElement("option");
        const modeTxt = info.record_mode === "motion" ? " [Motion]" : (info.record_mode === "off" ? " [Live]" : " [24/7]");
        opt.value = id; opt.textContent = info.name + modeTxt;
        sel.appendChild(opt);
      }
      if (Object.keys(cameras).length === 0) {
        document.getElementById("statusText").textContent = "Chưa có camera. Bấm '+ Quản lý Camera' để thêm.";
        openCamModal();
        return;
      }
      currentCam = sel.value;
      sel.onchange = () => { currentCam = sel.value; loadTimeline(); playLive(); };
      dateInput.onchange = () => loadTimeline();
      await loadTimeline();
      playLive();
    }

    function applyBrandPreset() {
      const brand = document.getElementById("inpBrand").value;
      const box = document.getElementById("quickGenBox");
      if (brand === "custom") { box.style.display = "none"; return; }
      box.style.display = "grid";
      const ip = document.getElementById("genIp").value.trim() || "192.168.1.100";
      const u = encodeURIComponent(document.getElementById("genUser").value.trim() || "admin");
      const p = encodeURIComponent(document.getElementById("genPass").value.trim() || "password");

      let main = "", sub = "";
      if (brand === "imou") {
        main = `rtsp://${u}:${p}@${ip}:554/cam/realmonitor?channel=1&subtype=0`;
        sub  = `rtsp://${u}:${p}@${ip}:554/cam/realmonitor?channel=1&subtype=1`;
      } else if (brand === "ezviz") {
        main = `rtsp://${u}:${p}@${ip}:554/Streaming/Channels/101`;
        sub  = `rtsp://${u}:${p}@${ip}:554/Streaming/Channels/102`;
      } else if (brand === "tapo") {
        main = `rtsp://${u}:${p}@${ip}:554/stream1`;
        sub  = `rtsp://${u}:${p}@${ip}:554/stream2`;
      } else if (brand === "yoosee") {
        main = `rtsp://${u}:${p}@${ip}:554/onvif1`;
        sub  = `rtsp://${u}:${p}@${ip}:554/onvif2`;
      } else if (brand === "xiaomi") {
        main = `rtsp://${u}:${p}@${ip}:554/ch0_0.h264`;
        sub  = `rtsp://${u}:${p}@${ip}:554/ch0_1.h264`;
      }
      document.getElementById("inpRtsp").value = main;
      document.getElementById("inpSubRtsp").value = sub;
    }

    function openCamModal() {
      const box = document.getElementById("camListBox");
      box.innerHTML = "";
      for (const [id, info] of Object.entries(cameras)) {
        const mode = info.record_mode || "continuous";
        const modeLabel = mode === "motion" ? "Chỉ lưu Motion" : (mode === "off" ? "Chỉ Live" : "Lưu 24/7");
        const div = document.createElement("div");
        div.className = "cam-item";
        div.innerHTML = `<div><b>${info.name}</b> (${id}) <span class="badge ${mode}">${modeLabel}</span></div>
                         <div style="display:flex;gap:6px;">
                           <button onclick="editCam('${id}')">Sửa</button>
                           <button onclick="removeCam('${id}')">Xóa</button>
                         </div>`;
        box.appendChild(div);
      }
      document.getElementById("camModal").style.display = "flex";
    }
    function closeCamModal() { document.getElementById("camModal").style.display = "none"; }

    function editCam(id) {
      const c = cameras[id];
      document.getElementById("inpCamId").value = id;
      document.getElementById("inpCamName").value = c.name || "";
      document.getElementById("inpBrand").value = c.brand || "custom";
      document.getElementById("inpRecordMode").value = c.record_mode || "continuous";
      document.getElementById("inpRtsp").value = c.rtsp_url || "";
      document.getElementById("inpSubRtsp").value = c.sub_rtsp_url || "";
      document.getElementById("inpTransport").value = c.rtsp_transport || "tcp";
      document.getElementById("inpAudio").value = c.audio_mode || "aac";
    }

    async function saveCamera() {
      const payload = {
        cam_id: document.getElementById("inpCamId").value.trim(),
        name: document.getElementById("inpCamName").value.trim(),
        brand: document.getElementById("inpBrand").value,
        record_mode: document.getElementById("inpRecordMode").value,
        rtsp_url: document.getElementById("inpRtsp").value.trim(),
        sub_rtsp_url: document.getElementById("inpSubRtsp").value.trim(),
        rtsp_transport: document.getElementById("inpTransport").value,
        audio_mode: document.getElementById("inpAudio").value
      };
      if (!payload.cam_id || !payload.name || !payload.rtsp_url) {
        return alert("Vui lòng điền đủ Mã Camera, Tên và đường dẫn RTSP!");
      }
      await fetch("/api/cameras", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      closeCamModal();
      await init();
    }

    async function removeCam(id) {
      if (!confirm(`Xóa camera ${id}?`)) return;
      await fetch(`/api/cameras/${id}`, {method: "DELETE"});
      await init();
      openCamModal();
    }

    async function openStorageModal() {
      await loadSystem();
      document.getElementById("inpRetDays").value = sysInfo.retention_days;
      document.getElementById("inpMaxGb").value = sysInfo.max_storage_gb;
      document.getElementById("inpMaxPct").value = sysInfo.max_disk_percent;
      document.getElementById("inpPostMotion").value = sysInfo.post_motion_sec;
      document.getElementById("storageModal").style.display = "flex";
    }
    function closeStorageModal() { document.getElementById("storageModal").style.display = "none"; }

    async function saveStorage() {
      const payload = {
        retention_days: parseFloat(document.getElementById("inpRetDays").value) || 7,
        max_storage_gb: parseFloat(document.getElementById("inpMaxGb").value) || 0,
        max_disk_percent: parseFloat(document.getElementById("inpMaxPct").value) || 85,
        post_motion_sec: parseInt(document.getElementById("inpPostMotion").value) || 60
      };
      await fetch("/api/storage", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      closeStorageModal();
      await loadSystem();
    }

    async function cleanNow() {
      const res = await fetch("/api/storage/clean", {method: "POST"});
      const data = await res.json();
      alert(`Đã dọn dẹp ${data.deleted_files} file video/ảnh quá hạn!`);
      await loadSystem();
      await loadTimeline();
    }

    async function testMotion() {
      if (!currentCam) return;
      await fetch("/api/motion", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({cam_id: currentCam, label: "Kích hoạt thử (Test)"})
      });
      setTimeout(() => { loadTimeline(); loadSystem(); }, 1500);
    }

    function playLive() {
      if (!currentCam) return;
      document.getElementById("btnLive").classList.add("active");
      document.getElementById("statusText").textContent = "Đang xem trực tiếp (Live)";
      const hlsUrl = `/hls/${currentCam}/live.m3u8`;
      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = hlsUrl;
      }
    }

    async function loadTimeline() {
      if (!currentCam) return;
      const res = await fetch(`/api/timeline/${currentCam}?date=${dateInput.value}`);
      const data = await res.json();
      segments = data.segments;
      const bar = document.getElementById("timelineBar");
      bar.innerHTML = '<div class="cursor-line" id="cursorLine"></div>';

      segments.forEach(s => {
        const el = document.createElement("div");
        el.className = "seg-mark";
        el.style.left = (s.start_sec / 86400 * 100) + "%";
        bar.appendChild(el);
      });

      const list = document.getElementById("eventsList");
      list.innerHTML = "";
      data.events.forEach(e => {
        const mark = document.createElement("div");
        mark.className = "evt-mark";
        mark.style.left = (e.sec_of_day / 86400 * 100) + "%";
        mark.title = `${e.time} - ${e.label}`;
        bar.appendChild(mark);

        const card = document.createElement("div");
        card.className = "event-card";
        card.onclick = () => playAtSecond(e.sec_of_day);
        card.innerHTML = `<img src="${e.snapshot}" onerror="this.style.display='none'">
                          <div style="margin-top:6px;font-size:13px;"><b>${e.time}</b> - ${e.label}</div>`;
        list.appendChild(card);
      });
    }

    function seekTimeline(ev) {
      const rect = ev.currentTarget.getBoundingClientRect();
      const clickSec = Math.floor(((ev.clientX - rect.left) / rect.width) * 86400);
      playAtSecond(clickSec);
    }

    function playAtSecond(targetSec) {
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById("btnLive").classList.remove("active");
      document.getElementById("cursorLine").style.left = (targetSec / 86400 * 100) + "%";

      let chosenIdx = -1;
      for (let i = 0; i < segments.length; i++) {
        if (segments[i].start_sec <= targetSec) chosenIdx = i;
        else break;
      }
      if (chosenIdx === -1) {
        document.getElementById("statusText").textContent = "Không có bản ghi ở khung giờ này";
        return;
      }

      const seg = segments[chosenIdx];
      const offset = Math.max(0, targetSec - seg.start_sec);
      document.getElementById("statusText").textContent = `Phát lại: ${seg.time}`;
      video.src = seg.file;
      video.currentTime = offset;
      video.play();

      video.onended = () => {
        if (chosenIdx + 1 < segments.length) {
          chosenIdx++;
          video.src = segments[chosenIdx].file;
          video.play();
        }
      };
    }

    init();
  </script>
</body>
</html>
